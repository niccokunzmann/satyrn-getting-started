[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.22,<0.14.0" ]

[project]
name = "satyrn-cli"
version = "0.1.0"
description = "Generate code with a local model: Open Interpreter + Ollama, pinned and reproducible"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
# The `satyrn` command needs only the standard library. Install it from a clone with
# `python3.14 satyrn.py install` (editable, so it keeps using the clone's .runtime/).
dependencies = []

[project.optional-dependencies]
# `satyrn-codegen`, Satyrn's own engine (Apple Silicon); see docs/satyrn-engine.md.
engine = [
  # Same pin satyrn-agent uses; must stay in lockstep with ../satyrn-agent/pyproject.toml.
  "ds4py @ git+https://github.com/rochecompaan/ds4-py.git@5c98c6ac86cafef56780c3bcbb87c3ecaef52aef",
  "satyrn-agent",
]

[project.scripts]
satyrn = "satyrn_local.cli:run"
satyrn-codegen = "satyrn_codegen.entry:main"

[tool.uv]
# Development (tests, lint) also covers satyrn-codegen, so it installs the engine.
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = ["satyrn_local", "satyrn_codegen"]

[tool.uv.sources]
satyrn-agent = { path = "../satyrn-agent", editable = true }

[dependency-groups]
dev = [ "pre-commit>=4.7.0", "pytest>=9.1.1", "ruff==0.17.4", "satyrn-cli[engine]" ]  # ruff: as in .pre-commit-config.yaml

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.markers = [ "live: sends a task through the real local model (needs a running server and pulled model)" ]

[tool.ruff]
line-length = 120
target-version = "py314"
src = [ "src", "tests" ]
# Installed and rewritten by ai-prompt-auto-commit (`make hooks`); not ours to reformat.
extend-exclude = [ ".claude/hooks", ".codex/hooks" ]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PIE", "PL",
  "S", "BLE", "TRY", "ANN", "FBT", "RUF", "N", "ERA", "T20", "DTZ", "LOG", "PERF",
]
ignore = [
  "T201",    # print is the user interface of these CLIs
  "TRY003",  # messages at raise sites carry the useful context
  "PLR2004", # small literals (exit codes, ports) read better inline
  "S603",    # subprocess calls run pinned, verified binaries or the user's approved command
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [ "S101", "S607", "ANN", "FBT", "PLC0415", "INP001" ]

[tool.ruff.lint.pylint]
max-args = 8
