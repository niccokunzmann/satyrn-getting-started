# What Open Interpreter should know about each local model.
#
# Open Interpreter 0.0.60 has metadata only for OpenAI's hosted models; any other model gets a
# generic fallback that names tools it does not have. The satyrn.py commands turn this file and
# config/context/open-interpreter.md into .runtime/interpreter-home/models.json, which config/interpreter.toml
# passes to the interpreter as `model_catalog_json`. Edits apply on the next `interpreter`,
# `check` or `bench` run.
#
# To use another model: pull it (`python satyrn.py pull NAME`) and add a [NAME] table here.

[defaults]
tool_output_tokens = 4000   # command output beyond this is truncated (saves context)
reasoning_efforts = []      # values for `reasoning.effort`; [] = the model has no such setting
# For `satyrn models`: download_gb (model files), memory_gb (in memory with the 32k context,
# from Ollama's /api/ps), dense (all weights are read for every token: slow without a GPU) and
# the sqrt.py benchmark on this machine:
benchmark_machine = "an Intel i7-13700H laptop CPU without GPU"

["gpt-oss:20b"]
reasoning_efforts = ["low", "medium", "high"]
default_effort = "medium"
kind = "MoE, 21B parameters, 3.6B active"
download_gb = 13.8
memory_gb = 14.1
dense = false
benchmark = { median_s = 128, passed = 6, runs = 6 }

["qwen3.6:35b-a3b"]
kind = "MoE, 35B parameters, 3B active"
download_gb = 22.6
memory_gb = 22.4
dense = false
benchmark = { median_s = 220, passed = 6, runs = 6 }

["qwen3-coder:30b"]
kind = "MoE, 31B parameters, 3.3B active"
download_gb = 18.6
memory_gb = 22.0
dense = false
benchmark = { median_s = 244, passed = 4, runs = 6 }

["qwen3.8:27b"]
description = "The base model of Satyrn's own engine (Path B), as Ollama's library build"
kind = "dense, 27B parameters"
download_gb = 17.7
memory_gb = 18.3
dense = true
benchmark = { median_s = 715, passed = 6, runs = 6 }
