# Git hooks, as in icalendar: `make hooks` (or `uv run pre-commit install`) once per clone.
#   pre-commit         ruff lint + format, debug statements, REUSE licensing
#   prepare-commit-msg AI prompts recorded in .prompts/ are appended to the commit message
#   post-commit        the used prompts are archived in .prompts/committed/
default_install_hook_types: [pre-commit, prepare-commit-msg, post-commit]

repos:
  - repo: https://github.com/pycalendar/ai-prompt-auto-commit
    rev: v0.1.0
    hooks:
      - id: prepare-ai-repository
      - id: unstage-ai-prompts
      - id: append-ai-prompts
      - id: archive-ai-prompts

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # also update the ruff pin in pyproject.toml
    hooks:
      - id: ruff-check
        stages: [pre-commit]
        args: [--config, "pyproject.toml", --fix]
      - id: ruff-format
        stages: [pre-commit]
        args: [--config, "pyproject.toml"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
        stages: [pre-commit]  # not again at prepare-commit-msg / post-commit
