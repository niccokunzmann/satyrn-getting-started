# Pinned inputs for a reproducible local-model setup (`python satyrn.py setup`).
# Every download is checked against its sha256 before it is unpacked.
# Change a version only together with all of its checksums.

[model]
default = "gpt-oss:20b"   # what `interpreter --oss` uses
# Context window the Ollama server offers to clients (tokens).
context_length = 32768

# Manifest digest each tag must resolve to; `setup`, `pull` and `verify` fail if upstream changes
# one. The default model is required; the others are pulled only for comparisons (`bench`).
[model.digests]
"gpt-oss:20b" = "f38aa0c53da5f8c49d08c43a99df24ff53167fe68e24664a7777288e7656fdfe"
"qwen3-coder:30b" = "06c1097efce0431c2045fe7b2e5108366e43bee1b4603a7aded8f21689e90bca"
"qwen3.6:35b-a3b" = "a7eb95c53bcf96b4bdd008d0fab4a5dac88047d9c1a7a9ab88ed453423fbd87c"
"qwen3.8:27b" = "aaee06c39dcf2437cde036998d960e1fc1494b8191be7cc9657d01e509097813"   # Satyrn's base model

